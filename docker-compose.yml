version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mojo-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mojo-postgres-network

  # TimescaleDB variant (for future time-series testing)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: mojo-postgres-timescale
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5433:5432"  # Different port to avoid conflict
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mojo-postgres-network
    profiles:
      - timescale  # Only start with: docker-compose --profile timescale up

volumes:
  postgres_data:
    driver: local
  timescale_data:
    driver: local

networks:
  mojo-postgres-network:
    driver: bridge
